<!doctype html>
<html lang="de" data-thema="modern" data-modus="hell" data-brett="nacht" data-bewegung="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brett-Demo · Crownmate</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/themes/modern.css">
<link rel="stylesheet" href="../css/board.css">
<link rel="stylesheet" href="../css/app.css">
<style>
  /* Demo-Seite fuer js/board.js: Sockel und Effekt-Ebene wie in der Partie (.brett-rahmen > .brett + .brett-effekte) */
  html, body { height: auto; min-height: 100%; }
  body {
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 16px max(16px, env(safe-area-inset-left));
  }
  .buehne { display: flex; gap: 24px; align-items: flex-start; max-width: 1200px; margin: 0 auto; }
  .brett-platz { flex: none; width: min(calc(100dvh - 48px), calc(100vw - 420px)); min-width: 280px; padding: 10px; }
  .seite { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  @media (max-width: 860px) {
    .buehne { flex-direction: column; }
    .brett-platz { width: 100%; padding: 10px; }
    .seite { width: 100%; }
  }
  h1 { font-family: var(--display); font-size: 22px; margin: 0; letter-spacing: var(--lw-titel); }
  .karte { background: var(--flaeche); border-radius: var(--r-m); padding: 12px 14px; box-shadow: var(--s1), var(--kante); }
  .knoepfe { display: flex; flex-wrap: wrap; gap: 8px; }
  button, select {
    min-height: 44px; padding: 0 14px; border-radius: var(--r-knopf); border: 1px solid var(--linie-2);
    background: var(--flaeche-2); color: inherit; font: inherit; font-weight: 650; cursor: pointer;
    touch-action: manipulation;
  }
  button:active { background: var(--flaeche-3); }
  label { display: inline-flex; gap: 8px; align-items: center; min-height: 44px; margin-right: 12px; }
  input[type=checkbox] { width: 22px; height: 22px; }
  #fen { width: 100%; min-height: 40px; border-radius: var(--r-s); border: 1px solid var(--linie-2); background: var(--grund-2); color: inherit; padding: 6px 8px; font: 13px ui-monospace, Menlo, monospace; }
  #status { font-weight: 800; font-size: 17px; }
  #zuege { font-variant-numeric: tabular-nums; color: var(--text-2); min-height: 1.4em; word-break: break-word; }
  #ereignis { color: var(--text-2); font-size: 13px; }
  .galerie { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .galerie div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--text-2); text-align: center; }
  .galerie span.sym { width: 34px; height: 34px; display: block; }
  .galerie span.sym svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="buehne">
  <div class="brett-platz">
    <div class="brett-rahmen"><div id="brett" class="brett"></div><div class="brett-effekte" aria-hidden="true"></div></div>
  </div>
  <div class="seite">
    <h1>Brett-Demo</h1>
    <div class="karte">
      <div id="status">Weiß am Zug</div>
      <div id="zuege"></div>
      <div id="ereignis">Tippe eine Figur an oder zieh sie mit dem Finger. Rechtsklick (oder Finger halten) malt Pfeile.</div>
    </div>
    <div class="karte knoepfe">
      <button id="neu">Neue Partie</button>
      <button id="zurueck">Zurück</button>
      <button id="drehen">Brett drehen</button>
      <button id="hinweis">Hinweis</button>
      <button id="pfeile">Beispiel-Pfeile</button>
      <button id="leeren">Pfeile/Abzeichen weg</button>
    </div>
    <div class="karte">
      <label><input type="checkbox" id="koord" checked> Koordinaten</label>
      <label><input type="checkbox" id="abz" checked> Abzeichen nach jedem Zug</label>
      <label><input type="checkbox" id="ton" checked> Klang</label>
      <label><input type="checkbox" id="bestaetigen"> Zug bestätigen</label>
      <label><input type="checkbox" id="autodame"> Automatisch Dame</label>
      <label><input type="checkbox" id="turm"> Turm auf König rochiert</label>
      <label><input type="checkbox" id="malen" checked> Pfeile malen</label>
    </div>
    <div class="karte knoepfe">
      <select id="brettfarbe" aria-label="Brettfarbe">
        <option value="nacht">Brett: Nacht</option>
        <option value="gruen">Brett: Grün</option>
        <option value="holz">Brett: Holz</option>
      </select>
      <select id="modus" aria-label="Erscheinungsbild">
        <option value="hell">Hell</option>
        <option value="dunkel">Dunkel</option>
      </select>
      <select id="koordlage" aria-label="Lage der Koordinaten">
        <option value="ecke">Koordinaten: Ecke</option>
        <option value="rand">Koordinaten: Rand</option>
      </select>
      <select id="steuerung" aria-label="Figuren bewegen">
        <option value="beides">Bewegen: Beides</option>
        <option value="ziehen">Bewegen: Ziehen</option>
        <option value="tippen">Bewegen: Tippen</option>
      </select>
      <select id="bewegung" aria-label="Animationstempo">
        <option value="langsam">Bewegung: Langsam</option>
        <option value="normal" selected>Bewegung: Normal</option>
        <option value="schnell">Bewegung: Schnell</option>
        <option value="aus">Bewegung: Aus</option>
      </select>
    </div>
    <div class="karte knoepfe">
      <select id="stellung" aria-label="Teststellung">
        <option value="">Teststellung …</option>
        <option value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1">Grundstellung</option>
        <option value="r3k2r/pppq1ppp/2npbn2/2b1p3/2B1P3/2NPBN2/PPPQ1PPP/R3K2R w KQkq - 6 8">Rochade (beide Seiten)</option>
        <option value="rnbqkbnr/ppp1p1pp/8/3pPp2/8/8/PPPP1PPP/RNBQKBNR w KQkq f6 0 3">En passant (exf6)</option>
        <option value="2r4k/1P4pp/8/8/8/8/5PPP/6K1 w - - 0 1">Umwandlung (b8 oder bxc8)</option>
        <option value="rnb1kbnr/pppp1ppp/8/4p3/6Pq/5P2/PPPPP2P/RNBQKBNR w KQkq - 1 3">Schachmatt</option>
        <option value="4k3/8/8/8/8/8/1p6/4K3 b - - 0 1">Umwandlung Schwarz</option>
      </select>
      <select id="symbole" aria-label="Symbole">
        <option value="">Symbole: Platzhalter</option>
        <option value="app">Symbole: App (js/symbole.js)</option>
      </select>
    </div>
    <div class="karte">
      <input id="fen" aria-label="FEN" spellcheck="false">
    </div>
    <div class="karte"><div class="galerie" id="galerie"></div></div>
  </div>
</div>

<script type="module">
import { Chess } from '../vendor/chess/chess.js';
import { Brett, zielKarte, setzeSymbole, symbolSvg, KLASSEN_TITEL } from '../js/board.js';
import { klang } from '../js/sounds.js';
import { setzeBewegung, setzeFedern, tempo } from '../js/bewegung.js';

const KLASSEN = ['brillant', 'stark', 'bester', 'exzellent', 'gut', 'buch', 'ungenau', 'fehler', 'verpasst', 'patzer', 'erzwungen'];

const $ = (id) => document.getElementById(id);
const chess = new Chess();
const zugLog = [];
// W0+a: abgelehnte Zugversuche (beiAbgelehnt)
const abgelehntLog = [];
let abzeichenNr = 0;
let letzterZug = null;
let turmRochade = false;

setzeFedern({ feder: [420, 30], weich: [210, 24], hupf: [520, 18] });

const brett = new Brett($('brett'), {
  figurenPfad: '../assets/pieces/',
  beiZug(von, nach, umwandlung) {
    let zug = null;
    try { zug = chess.move({ from: von, to: nach, promotion: umwandlung }); } catch (e) { zug = null; }
    zugLog.push({ von, nach, umwandlung: umwandlung || null, ok: !!zug });
    if (!zug) {
      $('ereignis').textContent = `beiZug(${von}, ${nach}) abgewiesen`;
      if ($('ton').checked) klang.fehler();
      return false;
    }
    $('ereignis').textContent = `beiZug(${von}, ${nach}${umwandlung ? ', ' + umwandlung : ''}) angenommen: ${zug.san}`;
    nachZug(zug, true);
    return true;
  },
  beiAbgelehnt(von, nach, art) { abgelehntLog.push({ von, nach, art }); },
});

function schachFeld() {
  if (!chess.inCheck()) return null;
  const farbe = chess.turn();
  for (const reihe of chess.board()) for (const f of reihe) if (f && f.type === 'k' && f.color === farbe) return f.square;
  return null;
}

function spieleKlang(zug) {
  if (!$('ton').checked || !zug) return;
  if (chess.isGameOver()) klang.ende(chess.isCheckmate() ? true : null);
  else if (chess.inCheck()) klang.schach();
  else if (zug.promotion) klang.umwandlung();
  else if (zug.isKingsideCastle() || zug.isQueensideCastle()) klang.rochade();
  else if (zug.captured) klang.schlagen();
  else klang.zug();
}

function freigeben() {
  brett.erlaubeZuege(chess.isGameOver() ? null : zielKarte(chess, { turmRochade }));
}

function nachZug(zug, vomBrett) {
  letzterZug = zug ? [zug.from, zug.to] : null;
  brett.setzeStellung(chess.fen(), { animieren: true, letzterZug, schach: schachFeld() });
  freigeben();
  brett.pfeile([]);
  brett.markiere(null);
  if (zug && $('abz').checked) {
    const k = KLASSEN[abzeichenNr++ % KLASSEN.length];
    brett.zeigeAbzeichen(zug.to, k);
    if (k === 'brillant' && $('ton').checked) setTimeout(() => klang.brillant(), 160);
  } else brett.entferneAbzeichen();
  // der Klang sitzt auf der Landung der Figur (gleitDauer), nicht auf dem Start
  if (vomBrett) setTimeout(() => spieleKlang(zug), brett.gleitDauer() * 0.9);
  zeigeStatus();
}

function zeigeStatus() {
  const farbe = chess.turn() === 'w' ? 'Weiß' : 'Schwarz';
  let s = `${farbe} am Zug`;
  if (chess.isCheckmate()) s = `Schachmatt – ${chess.turn() === 'w' ? 'Schwarz' : 'Weiß'} gewinnt`;
  else if (chess.isDraw()) s = 'Remis';
  else if (chess.inCheck()) s += ' · Schach!';
  $('status').textContent = s;
  $('zuege').textContent = chess.history().map((z, i) => (i % 2 === 0 ? (i / 2 + 1) + '. ' : '') + z).join(' ');
  $('fen').value = chess.fen();
}

function setzeFen(fen) {
  chess.load(fen);
  letzterZug = null;
  brett.entferneAbzeichen();
  brett.pfeile([]);
  brett.markiere(null);
  brett.setzeStellung(chess.fen(), { animieren: false, schach: schachFeld() });
  freigeben();
  zeigeStatus();
}

function setzeBrett(id) {
  document.documentElement.dataset.brett = id;
  $('brettfarbe').value = id;
}
function setzeModus(m) {
  document.documentElement.dataset.modus = m;
  $('modus').value = m;
}
function setzeTempo(stufe) {
  setzeBewegung(stufe);
  $('bewegung').value = stufe;
}
function setzeTurmRochade(an) {
  turmRochade = !!an;
  $('turm').checked = turmRochade;
  brett.setzeTurmRochade(turmRochade);
  freigeben();
}

async function ladeSymbole(variante) {
  if (!variante) { setzeSymbole(Object.fromEntries(KLASSEN.map((k) => [k, null]))); zeigeGalerie(); return; }
  try {
    const { SYMBOLE } = await import('../js/symbole.js');
    setzeSymbole(SYMBOLE);
  } catch (e) { /* Datei fehlt: Platzhalter bleibt */ }
  zeigeGalerie();
}

function zeigeGalerie() {
  $('galerie').innerHTML = KLASSEN.map((k) =>
    `<div><span class="sym">${symbolSvg(k)}</span>${KLASSEN_TITEL[k]}</div>`).join('');
}

$('neu').onclick = () => setzeFen(new Chess().fen());
$('zurueck').onclick = () => {
  const z = chess.undo();
  if (!z) return;
  const vorher = chess.history({ verbose: true }).at(-1);
  letzterZug = vorher ? [vorher.from, vorher.to] : null;
  brett.entferneAbzeichen();
  brett.setzeStellung(chess.fen(), { animieren: true, letzterZug, schach: schachFeld() });
  freigeben();
  zeigeStatus();
};
$('drehen').onclick = () => brett.dreheUm();
$('koord').onchange = (e) => brett.koordinaten(e.target.checked);
$('ton').onchange = (e) => { klang.aus = !e.target.checked; };
$('bestaetigen').onchange = (e) => brett.setzeBestaetigen(e.target.checked);
$('autodame').onchange = (e) => brett.setzeAutoDame(e.target.checked);
$('turm').onchange = (e) => setzeTurmRochade(e.target.checked);
$('malen').onchange = (e) => brett.setzePfeileErlaubt(e.target.checked);
$('brettfarbe').onchange = (e) => setzeBrett(e.target.value);
$('modus').onchange = (e) => setzeModus(e.target.value);
$('koordlage').onchange = (e) => brett.setzeKoordLage(e.target.value);
$('steuerung').onchange = (e) => brett.setzeSteuerung(e.target.value);
$('bewegung').onchange = (e) => setzeTempo(e.target.value);
$('hinweis').onclick = () => {
  const z = chess.moves({ verbose: true });
  if (!z.length) return;
  const w = z[Math.floor(Math.random() * z.length)];
  brett.markiere([w.from], 'hinweis');
  brett.pfeile([{ von: w.from, nach: w.to, farbe: 'hinweis' }]);
};
$('pfeile').onclick = () => {
  const z = chess.moves({ verbose: true });
  const springer = z.find((m) => m.piece === 'n');
  const andere = z.filter((m) => m.piece !== 'n');
  const liste = [];
  if (springer) liste.push({ von: springer.from, nach: springer.to, farbe: 'bester' });
  if (andere[0]) liste.push({ von: andere[0].from, nach: andere[0].to, farbe: 'fehler' });
  if (andere.at(-1)) liste.push({ von: andere.at(-1).from, nach: andere.at(-1).to, farbe: 'stark' });
  if (andere[1]) liste.push({ von: andere[1].to, nach: andere[1].to, farbe: 'patzer' });
  brett.pfeile(liste);
};
$('leeren').onclick = () => { brett.pfeile([]); brett.entferneAbzeichen(); brett.markiere(null); brett.loescheNutzerPfeile(); };
$('stellung').onchange = (e) => { if (e.target.value) setzeFen(e.target.value); e.target.value = ''; };
$('symbole').onchange = (e) => ladeSymbole(e.target.value);
$('fen').onchange = (e) => { try { setzeFen(e.target.value.trim()); } catch (err) { $('ereignis').textContent = 'FEN ungültig'; } };

zeigeGalerie();
setzeFen(chess.fen());

window.demo = { brett, chess, setzeFen, zugLog, abgelehntLog, klang, setzeSymbole, symbolSvg, ladeSymbole, KLASSEN,
  setzeBrett, setzeModus, setzeTempo, setzeTurmRochade, tempo,
  abzeichenAus() { $('abz').checked = false; } };
window.bereit = true;
</script>
</body>
</html>
