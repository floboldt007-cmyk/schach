<!doctype html>
<html lang="de" data-thema="modern" data-modus="system" data-brett="nacht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Testseite: Bauteile und Hauptseiten-Kopf</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/themes/modern.css">
<link rel="stylesheet" href="../css/board.css">
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/bauteile.css">
<link rel="stylesheet" href="../css/navigation.css">
<link rel="stylesheet" href="../css/training.css">
<style>
  /* nur fuer die Testseite: alles untereinander, scrollt */
  .bt-seite { height: auto; min-height: 100dvh; overflow: visible; }
  .bt-inhalt { display: grid; gap: 18px; padding: 8px var(--rand) 48px; max-width: 720px; }
  .bt-inhalt h2 { margin: 8px 0 0; font-size: var(--fs-ueber); font-weight: var(--gw-stark); letter-spacing: var(--lw-ueber); text-transform: uppercase; color: var(--text-2); }
  .bt-reihe { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .bt-mini { width: 140px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
// Testseite fuer die Bauteile aus js/ui/bauteile.js und den Hauptseiten-Kopf aus js/ui/seite.js (Premium-Umbau U2),
// ohne die App: Fake-App mit einstellungen()/setzeEinstellungen() ueber storage.js und meldung() ueber toast().
// tests/navigation.test.mjs bedient sie; alles Wichtige liegt in window.__bt.
//   bauteile.html            alle Bauteile
//   bauteile.html?modus=dunkel
import { segment, schalter, regler, sheet, halteKnopf, toast, miniBrett } from '../js/ui/bauteile.js';
import { hauptKopf, seitenKopf, verbindeKopf } from '../js/ui/seite.js';
import { icon } from '../js/ui/icons.js';
import { ladeEinstellungen, speichereEinstellungen } from '../js/storage.js';
import { wendeThemaAn } from '../js/thema.js';
import { setzeBewegung, starteDruck } from '../js/bewegung.js';

const q = new URLSearchParams(location.search);
const log = [];
const fehler = [];
window.addEventListener('error', (e) => fehler.push(String(e.message || e)));
window.addEventListener('unhandledrejection', (e) => fehler.push('Promise: ' + String(e.reason && e.reason.message || e.reason)));

const app = {
  einstellungen: () => ladeEinstellungen(),
  setzeEinstellungen(teil) {
    const e = speichereEinstellungen(teil);
    log.push(['einstellungen', teil]);
    wendeThemaAn({ thema: e.thema, modus: e.modus });
    window.dispatchEvent(new CustomEvent('schach:einstellungen', { detail: e }));
    return e;
  },
  meldung(t, o) { log.push(['meldung', t]); toast(t, o); },
  gehe(n) { log.push(['gehe', n]); },
  zurueck() { log.push(['zurueck']); },
};
const e0 = ladeEinstellungen();
await wendeThemaAn({ thema: e0.thema, modus: q.get('modus') || e0.modus });
setzeBewegung(q.get('bewegung') || e0.bewegung);
starteDruck();

const s = document.createElement('section');
s.className = 'screen bt-seite';
s.innerHTML = `${hauptKopf({ zurueck: true, knoepfe: [{ aktion: 'verlauf', icon: 'verlauf', label: 'Verlauf' }] })}
  ${seitenKopf({ ueber: 'Testseite', titel: 'Bauteile', text: 'Segment, Schalter, Regler, Halte-Knopf, Blatt, Meldung, Mini-Brett.' })}
  <div class="bt-inhalt">
    <h2>Segment</h2><div class="bt-ort" data-ort="segment"></div>
    <h2>Schalter</h2><div class="bt-reihe" data-ort="schalter"><span>Klang</span></div>
    <h2>Regler</h2><div data-ort="regler"></div>
    <h2>Halte-Knopf</h2><div class="bt-reihe" data-ort="halte"></div>
    <h2>Blatt und Meldung</h2><div class="bt-reihe">
      <button class="knopf dr" type="button" data-test="sheet">Blatt öffnen</button>
      <button class="knopf dr" type="button" data-test="toast">Meldung</button></div>
    <h2>Mini-Brett</h2><div class="bt-reihe" data-ort="mini"></div>
    <h2>Coach-Karte</h2>
    <div class="coach-karte"><div class="coach-zeile"><span class="sym" aria-hidden="true">${icon('stern')}</span><b>Genial</b><span class="san">Sf5</span></div>
      <p>Der Springer opfert sich, und der König steht plötzlich ohne Schutz da.</p>
      <div class="bot-satz"><span class="av"></span>„Na warte!“</div></div>
  </div>`;
document.getElementById('app').append(s);
const kopf = verbindeKopf(s, app, { beiZurueck: () => app.zurueck(), beiEinstellungen: () => app.gehe('einstellungen') });

const seg = segment({ name: 'farbe', label: 'Farbe', wert: 'w', beiWahl: (id, o) => log.push(['segment', id, o.quelle]),
  optionen: [{ id: 'w', text: 'Weiß' }, { id: 'z', text: 'Zufall' }, { id: 'b', text: 'Schwarz', klein: 'zieht zweit' }] });
s.querySelector('[data-ort="segment"]').append(seg.el);
const sch = schalter({ name: 'klang', an: true, label: 'Klang', beiWechsel: (an) => log.push(['schalter', an]) });
s.querySelector('[data-ort="schalter"]').append(sch.el);
const reg = regler({ name: 'lautstaerke', label: 'Lautstärke', wert: 0.8, min: 0, max: 1, schritt: 0.05,
  links: icon('leise'), rechts: icon('laut'), beiAenderung: (w, o) => log.push(['regler', w, o.fertig]) });
s.querySelector('[data-ort="regler"]').append(reg.el);
let ausgeloest = 0;
const halte = halteKnopf({ text: 'Aufgeben', icon: icon('flagge'), hinweis: 'Zum Aufgeben gedrückt halten',
  frage: { titel: 'Aufgeben?', text: 'Die Partie zählt als verloren.', ja: 'Aufgeben', nein: 'Weiterspielen' },
  beiAusloesen: () => { ausgeloest++; log.push(['halte']); } });
s.querySelector('[data-ort="halte"]').append(halte.el);
s.querySelector('[data-ort="mini"]').innerHTML = `<div class="bt-mini">${miniBrett('rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1', { zuletzt: ['e2', 'e4'] })}</div>`;
let sheetWert = 'offen';
s.querySelector('[data-test="sheet"]').addEventListener('click', () => {
  sheetWert = 'offen';
  sheet({ titel: 'Wirklich?', text: 'Nur ein Test.', knoepfe: [{ text: 'Nein', wert: 'nein' }, { text: 'Ja', wert: 'ja', art: 'primaer' }], abbrechen: 'ab' })
    .then((w) => { sheetWert = w; log.push(['sheet', w]); });
});
s.querySelector('[data-test="toast"]').addEventListener('click', () => toast('Hallo vom Test'));

window.__bt = { log, fehler, seg, sch, reg, halte, kopf, app, ausgeloest: () => ausgeloest, sheetWert: () => sheetWert };
window.testseiteBereit = true;
</script>
</body>
</html>
