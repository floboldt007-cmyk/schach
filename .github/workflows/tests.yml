name: Tests

on:
  push:
  pull_request:

jobs:
  chromium:
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright installieren
        run: |
          # Feste Version (Luecken-Check 7): ein Update kommt nur bewusst, nie still ueber Nacht
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium webkit
      - name: Schnelle Tests bei Push
        if: github.event_name == 'push'
        run: |
          mkdir -p artifacts/screenshots
          set -o pipefail
          BILDER=artifacts/screenshots node tests/alle.mjs --schnell --parallel=3 --teil=${{ matrix.teil }}/3 --laut 2>&1 | tee artifacts/chromium.log
      - name: Vollständige Tests bei Pull Requests
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p artifacts/screenshots
          set -o pipefail
          BILDER=artifacts/screenshots node tests/alle.mjs --parallel=3 --teil=${{ matrix.teil }}/3 --laut 2>&1 | tee artifacts/chromium.log
      - name: Fehlerartefakte hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-${{ matrix.teil }}-fehler
          path: artifacts/
          if-no-files-found: ignore

  webkit:
    # Fest auf 24.04: Mit dem Wechsel von ubuntu-latest auf 26.04 (29.10.2026) kam die Figur im Brett-Test
    # (setzeDauer 400) unter WebKit nicht mehr nach 520 ms an (gleiche Playwright-WebKit v2370, aber deren Build fuer 26.04). Offen: Ursache klaeren.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright installieren
        run: |
          # Feste Version (Luecken-Check 7): ein Update kommt nur bewusst, nie still ueber Nacht
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium webkit
      - name: Browser-Suiten mit WebKit
        run: |
          mkdir -p artifacts/screenshots
          set -o pipefail
          BROWSER=webkit BILDER=artifacts/screenshots node tests/alle.mjs --nur=storage,board,screens,e2e,notfall,bericht,lobby --laut 2>&1 | tee artifacts/webkit.log
      - name: Fehlerartefakte hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-fehler
          path: artifacts/
          if-no-files-found: ignore
