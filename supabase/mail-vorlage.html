<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dein Anmeldecode</title>
  </head>
  <body style="margin:0;background:#f3efe7;color:#263238;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3efe7;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #ddd6ca;border-radius:16px;">
            <tr>
              <td style="padding:36px 32px;">
                <p style="margin:0 0 8px;color:#b4432f;font-size:14px;font-weight:bold;letter-spacing:.08em;text-transform:uppercase;">Crownmate</p>
                <h1 style="margin:0 0 16px;font-size:26px;line-height:1.25;">Dein Anmeldecode</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.6;">Gib diesen sechsstelligen Code in der App ein:</p>
                <p style="margin:0 0 24px;padding:18px;border-radius:10px;background:#f3efe7;text-align:center;font-family:ui-monospace,monospace;font-size:36px;font-weight:bold;letter-spacing:.22em;color:#263238;">{{ .Token }}</p>
                <p style="margin:0;font-size:14px;line-height:1.6;color:#647078;">Wenn du den Code nicht angefordert hast, kannst du diese E-Mail ignorieren. Teile den Code mit niemandem.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
