// Kleines Vorschau-Brett (statisch)
function miniBrett(fen, o = {}) {
  const s = Schach.ausFen(fen);
  const f = { nacht: ['#e4e8f6', '#7c87b6', 'rgba(118, 206, 255, .5)'], gruen: ['#eeeed2', '#769656', 'rgba(255, 236, 80, .5)'], holz: ['#f0d9b5', '#b58863', 'rgba(214, 220, 92, .52)'] }[o.brett || E.brett];
  let html = '';
  for (let i = 0; i < 64; i++) {
    const d = ((i >> 3) + (i & 7)) % 2;
    const z = o.zuletzt && o.zuletzt.includes(i) ? ' z' : '';
    html += `<i class="${d ? 'd' : 'h'}${z}">${s.b[i] ? `<img src="figuren/${s.b[i]}.svg" alt="" loading="lazy">` : ''}</i>`;
  }
  return `<div class="mini" style="--fh:${f[0]};--fd:${f[1]};--fz:${f[2]}" aria-hidden="true">${html}</div>`;
}

/* ================= App ================= */
Brett.prototype.zurueck = function (z, d = 300, vor = null) {
  const el = this.figuren.get(z.nach);
  if (vor) this.stellung = vor;
  this.leereAuswahl(); this.pfeilWeg();
  if (el) {
    const alt = el.style.transform; el.style.transform = this.tr(z.von);
    anim(el, [{ transform: alt }, { transform: el.style.transform }], { d, k: 'gleiten' });
    this.figuren.delete(z.nach); this.figuren.set(z.von, el);
    if (z.prom) el.firstChild.src = `figuren/${z.fig}.svg`;
  }
  if (z.roch) {
    const basis = z.fig[0] === 'w' ? 56 : 0;
    const tv = z.roch === 'k' ? basis + 7 : basis, tn = z.roch === 'k' ? basis + 5 : basis + 3;
    const t = this.figuren.get(tn);
    if (t) { const a = t.style.transform; t.style.transform = this.tr(tv); anim(t, [{ transform: a }, { transform: t.style.transform }], { d, k: 'gleiten' }); this.figuren.delete(tn); this.figuren.set(tv, t); }
  }
  if (z.schlag) {
    const i = z.ep ? z.nach + (z.fig[0] === 'w' ? 8 : -8) : z.nach;
    const f = this.figurEl(z.schlag); f.style.transform = this.tr(i); this.brett.append(f); this.figuren.set(i, f);
    anim(f, [{ opacity: 0, transform: f.style.transform + ' scale(.7)' }, { opacity: 1, transform: f.style.transform }], { d: d * 1.2, v: d * 0.4, k: 'weich' });
  }
  $$('.abz', this.brett).forEach((e) => e.remove());
  return warte(d);
};

const S = { arena: $('#s-arena'), training: $('#s-training'), verlauf: $('#s-verlauf'), einstellungen: $('#s-einstellungen'), partie: $('#s-partie'), raetsel: $('#s-raetsel') };
const TABS = ['arena', 'training', 'verlauf'];
const App = { oben: 'arena', tab: 'arena', stapel: [], bot: STAND.naechster, farbe: 'w', zeit: E.zeit };
const hexMisch = (a, b, t) => {
  const p = (x) => [1, 3, 5].map((i) => parseInt(x.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v * t + B[i] * (1 - t)).toString(16).padStart(2, '0')).join('');
};
BOTS.forEach((b) => { b.dunkel = hexMisch(b.farbe, '#1E2126', 0.26); });

/* ---------- Thema ---------- */
const dunkelMQ = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : { matches: false };
function modusAus() { return E.thema === 'system' ? (dunkelMQ.matches ? 'dunkel' : 'hell') : E.thema; }
function setzeModus(vonEl) {
  const neu = modusAus();
  if (ROOT.dataset.modus === neu) return;
  const tauschen = () => { ROOT.dataset.modus = neu; $$('[data-akt="thema"]').forEach((b) => { b.innerHTML = ic(neu === 'dunkel' ? 'sonne' : 'mond'); }); };
  if (vonEl && document.startViewTransition && tempo() > 0) {
    const r = vonEl.getBoundingClientRect(); const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    try {
      const vt = document.startViewTransition(tauschen);
      vt.ready.then(() => ROOT.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${rad}px at ${x}px ${y}px)`] },
        { duration: 680 * tempo(), easing: KURVEN.gleiten, pseudoElement: '::view-transition-new(root)' })).catch(() => {});
    } catch (e) { tauschen(); }
  } else tauschen();
}
if (dunkelMQ.addEventListener) dunkelMQ.addEventListener('change', () => setzeModus());

/* ---------- Toast ---------- */
let toastT = 0;
function toast(t) {
  const el = $('#toast'); el.textContent = t; el.hidden = false;
  anim(el, [{ opacity: 0, transform: 'translate(-50%, 16px) scale(.96)' }, { opacity: 1, transform: 'translate(-50%, 0)' }], { d: 420, k: 'feder' });
  clearTimeout(toastT);
  toastT = setTimeout(() => { anim(el, [{ opacity: 1 }, { opacity: 0, transform: 'translate(-50%, 8px)' }], { d: 220, k: 'sanft', fill: 'forwards' }).finished.then(() => { el.hidden = true; el.getAnimations().forEach((a) => a.cancel()); }); }, 2400);
}

/* ---------- Segmente (gemeinsam) ---------- */
function segment(name, opt, wert, cls = '') {
  const n = opt.length, i = Math.max(0, opt.findIndex((o) => o.id === wert));
  return `<div class="segment ${cls}" role="radiogroup" data-seg="${name}"><span class="seg-pille" style="width:calc((100% - 8px) / ${n});transform:translateX(${i * 100}%)"></span>` +
    opt.map((o) => `<button class="seg dr ${o.zeile ? 'seg-zeile' : ''}" role="radio" type="button" aria-checked="${o.id === wert}" data-wert="${esc(o.id)}">${o.html || esc(o.name)}${o.klein ? `<small>${esc(o.klein)}</small>` : ''}</button>`).join('') + '</div>';
}
function segmentSetze(seg, wert) {
  const knoepfe = $$('.seg', seg); const i = Math.max(0, knoepfe.findIndex((k) => k.dataset.wert === String(wert)));
  knoepfe.forEach((k, n) => k.setAttribute('aria-checked', n === i ? 'true' : 'false'));
  $('.seg-pille', seg).style.transform = `translateX(${i * 100}%)`;
}
const SEG = {};
document.addEventListener('click', (e) => {
  const k = e.target.closest('.seg'); if (!k) return;
  const seg = k.closest('.segment'); if (!seg || k.getAttribute('aria-checked') === 'true') return;
  segmentSetze(seg, k.dataset.wert);
  Klang.spiele('klick');
  const f = SEG[seg.dataset.seg]; if (f) f(k.dataset.wert, seg, k);
});

/* ---------- Navigation ---------- */
function tabsSetze(id) {
  const tabs = $('#tabs'); const knoepfe = $$('.tab', tabs);
  const k = knoepfe.find((b) => b.dataset.tab === id);
  knoepfe.forEach((b) => b.setAttribute('aria-selected', b === k ? 'true' : 'false'));
  if (k) { const p = $('.tab-pille', tabs); p.style.width = k.offsetWidth + 'px'; p.style.transform = `translateX(${k.offsetLeft - 5}px)`; }
}
function tabsZeigen(an) { $('#tabs').classList.toggle('weg', !an); }
function aufraeumen(el) { el.getAnimations({ subtree: false }).forEach((a) => a.cancel()); }
function zeigeTab(id) {
  if (App.oben === id) return;
  const alt = S[App.oben], neu = S[id];
  const dir = TABS.indexOf(id) > TABS.indexOf(App.tab) ? 1 : -1;
  App.oben = id; App.tab = id; tabsSetze(id); tabsZeigen(true);
  SEITE[id].baue();
  neu.hidden = false; neu.style.zIndex = 2; alt.style.zIndex = 1;
  anim(neu, [{ opacity: 0, transform: `translateX(${dir * 40}px)` }, { opacity: 1, transform: 'none' }], { d: 520, k: 'gleiten' });
  anim(alt, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${-dir * 28}px)` }], { d: 260, k: 'sanft', fill: 'forwards' })
    .finished.then(() => { if (App.oben !== alt.id.slice(2)) { alt.hidden = true; } aufraeumen(alt); });
  SEITE[id].eintritt && SEITE[id].eintritt();
  Klang.spiele('wechsel');
}
function push(id) {
  const alt = S[App.oben], neu = S[id];
  App.stapel.push(App.oben); App.oben = id;
  tabsZeigen(false);
  neu.hidden = false; neu.style.zIndex = 5; alt.style.zIndex = 1;
  anim(neu, [{ transform: 'translateX(100%)' }, { transform: 'none' }], { d: 560, k: 'gleiten' });
  anim(alt, [{ transform: 'none', opacity: 1 }, { transform: 'translateX(-20%)', opacity: .4 }], { d: 560, k: 'gleiten', fill: 'forwards' })
    .finished.then(() => { if (App.oben !== alt.id.slice(2)) alt.hidden = true; aufraeumen(alt); });
  Klang.spiele('wechsel');
}
function pop() {
  const zurueckId = App.stapel.pop(); if (!zurueckId) return;
  const alt = S[App.oben], neu = S[zurueckId];
  App.oben = zurueckId;
  neu.hidden = false; neu.style.zIndex = 1; alt.style.zIndex = 5;
  if (SEITE[zurueckId] && SEITE[zurueckId].auffrischen) SEITE[zurueckId].auffrischen();
  anim(neu, [{ transform: 'translateX(-20%)', opacity: .4 }, { transform: 'none', opacity: 1 }], { d: 520, k: 'gleiten' });
  anim(alt, [{ transform: 'none' }, { transform: 'translateX(100%)' }], { d: 480, k: 'gleiten', fill: 'forwards' })
    .finished.then(() => { if (App.oben !== alt.id.slice(2)) alt.hidden = true; aufraeumen(alt); if (alt === S.raetsel) Raetsel.weg(); });
  if (TABS.includes(zurueckId)) tabsZeigen(true);
  Klang.spiele('zurueck');
}

function kopfHtml() {
  return `<header class="kopf">
    <div class="marke"><div class="marke-zeichen">${LOGO}</div><div class="marke-text"><b>Schach-Arena</b><span>Besiege alle 10 Bots</span></div></div>
    <div class="rechts">

      <span class="chip zahl chip-pokal" aria-label="Pokale">${POKAL}<b data-zahl="pokale">${STAND.naechster}</b><span class="von" style="color:var(--text-2)">/10</span></span>
      <button class="knopf-icon dr knopf-thema" type="button" data-akt="thema" aria-label="Hell oder dunkel">${ic(ROOT.dataset.modus === 'dunkel' ? 'sonne' : 'mond')}</button>
      ${klangKnopf()}
      <button class="knopf-icon dr" type="button" data-akt="einstellungen" aria-label="Einstellungen">${ic('regler')}</button>
    </div></header>`;
}
function kopfEintritt(s) {
  const k = $('.kopf', s); if (!k) return;
  staffel([$('.marke', k), ...$$('.rechts > *', k)], { von: 'translateY(-10px)', d: 480, abstand: 40 });
}
function zaehle(el, von, bis, d = 700) {
  if (!el) return;
  const t0 = performance.now(), dauer = d * tempo();
  const schritt = (t) => {
    const p = dauer ? Math.min(1, (t - t0) / dauer) : 1;
    el.textContent = Math.round(von + (bis - von) * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(schritt);
  };
  requestAnimationFrame(schritt);
}

  // Sieg: alles wird vorab mit Verzoegerung geplant (fill: backwards), daher kein Aufblitzen.

    });
    const tz = t0 + 360 + 2 * 250 + 260;
    const zeilen = $$('.feier-zeile', k);
    zeilen.forEach((z, n) => anim(z, [{ opacity: 0, transform: 'translateX(-18px)' }, { opacity: 1, transform: 'none' }], { d: 560, v: tz + n * 70, k: 'weich' }));

  ruhig(v, art) {

  },
  // Tippen auf die Karte: Feier sofort zu Ende zeigen (Klaenge, die schon laufen, laufen aus)
  alles() {
    if (!this.offen) return;
    this.stopp(); this.v++;
    const k = $('#ergebnis .ergebnis-karte');
    $$('*', k).forEach((e) => e.getAnimations().forEach((a) => a.finish()));
    this.offen = null;
  },
  schliesse(f) {
    const d = $('#ergebnis');
    this.stopp(); this.v++;
    if (this.untenAnim && this.unten) { const a = this.untenAnim; this.untenAnim = null; anim(this.unten, [{ transform: 'scale(.975)' }, { transform: 'none' }], { d: 360, k: 'gleiten' }); a.cancel(); }
    anim($('.decke-grund', d), [{ opacity: 1 }, { opacity: 0 }], { d: 260, fill: 'forwards' });
    anim($('.variante-leiste', d), [{ opacity: 1 }, { opacity: 0 }], { d: 160, fill: 'forwards' });
    anim($('.ergebnis-karte', d), [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(24px) scale(.97)' }], { d: 280, k: 'sanft', fill: 'forwards' })
      .finished.then(() => { d.hidden = true; d.innerHTML = ''; if (f) f(); });
  },
};

/* ================= Raetsel ================= */
const Raetsel = {
  i: 0, brett: null,
  oeffne(i) {
    this.i = i;
    this.baue();
    push('raetsel');
    setTimeout(() => this.layout(), 0);
  },
  baue() {
    const s = S.raetsel, r = RAETSEL[this.i];
    s.innerHTML = `<header class="partie-kopf"><button class="knopf-icon dr" type="button" data-akt="pop" aria-label="Zurück">${ic('zurueck')}</button>
      <div class="titel"><b>${esc(r.titel)}</b><span>${esc(r.unter)}</span></div>
      <div class="rechts">${klangKnopf()}<button class="knopf-icon dr" type="button" data-akt="einstellungen" aria-label="Einstellungen">${ic('regler')}</button></div></header>
      <div class="partie-inhalt"><div class="brett-spalte"></div>
        <div class="seiten-spalte">
          <div class="raetsel-status"><span class="am-zug"><i></i>Weiß am Zug</span><h2>Finde den besten Zug</h2><p>${esc(r.text)}</p></div>
          <div class="loesung" hidden></div>
          <div class="raetsel-info"><div><span>Thema</span><b>${esc(r.thema)}</b></div><div><span>Stärke</span><b>${esc(r.staerke)}</b></div><div><span>Schwierigkeit</span><div class="raetsel-punkte">${[0, 1, 2].map((n) => `<i class="${n < r.punkte ? 'an' : ''}"></i>`).join('')}</div></div></div>
          <div class="raetsel-luft" style="flex:1"></div>
          <div class="aktionen" style="grid-template-columns:repeat(3,1fr)">
            <button class="aktion dr" type="button" data-r="hilfe">${ic('hinweis')}Hinweis</button>
            <button class="aktion dr" type="button" data-r="zeigen">${ic('auge')}Lösung</button>
            <button class="aktion dr" type="button" data-r="weiter">${ic('weiter')}Nächstes</button>
          </div></div></div>`;
    this.brett = new Brett({ interaktiv: true, darf: () => !this.fertig && !this.wartet, onZug: (z, g) => this.zug(z, g) });
    $('.brett-spalte', s).append(this.brett.el);
    this.pos = Schach.ausFen(r.fen); this.schritt = 0; this.fertig = false; this.wartet = false;
    this.brett.setze(this.pos);
    s.onclick = (e) => {
      const b = e.target.closest('[data-r]'); if (!b) return;
      if (b.dataset.r === 'hilfe') this.hilfe();
      if (b.dataset.r === 'zeigen') this.zeigen();
      if (b.dataset.r === 'weiter') this.weiter();
    };
  },
  layout() {
    const s = S.raetsel; if (!this.brett) return;
    const w = innerWidth, hh = innerHeight, hoch = w / hh < 1.08, handy = w <= 700;
    s.classList.toggle('hoch', hoch);
    let g;
    if (!hoch) g = Math.min(hh - 76 - 38 - 14, w - 48 - 20 - 340 - 14);
    else { g = Math.min(w - (handy ? 16 : 48) - 14, hh - (handy ? 60 : 76) - 420); s.style.setProperty('--sp-breite', (g + 14) + 'px'); }
    this.brett.groesse(Math.max(200, Math.floor(g / 8) * 8));
  },
  status(titel, text, geloest) {
    const st = $('.raetsel-status', S.raetsel); if (!st) return;
    st.classList.toggle('geloest', !!geloest);
    $('.am-zug', st).innerHTML = `${ic(geloest ? 'haken' : 'auge', 'ic-s')}${geloest ? 'Fertig' : 'Lösung'}`;
    const h2 = $('h2', st), p = $('p', st);
    anim(h2, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { d: 460, k: 'weich' }); h2.textContent = titel;
    anim(p, [{ opacity: 0 }, { opacity: 1 }], { d: 420, v: 60, k: 'sanft' }); p.textContent = text;
    anim(st, [{ transform: 'scale(1)' }, { transform: 'scale(1.02)' }, { transform: 'none' }], { d: 520, k: 'feder' });
  },
  meldung(art, titel, text) {
    const l = $('.loesung', S.raetsel);
    l.className = 'loesung ' + art; l.hidden = false;
    l.innerHTML = `<span class="sym">${ic(art === 'richtig' ? 'haken' : 'kreuz')}</span><div><b>${esc(titel)}</b><span>${esc(text)}</span></div>`;
    anim(l, [{ opacity: 0, transform: 'translateY(12px) scale(.97)' }, { opacity: 1, transform: 'none' }], { d: 560, k: 'weich' });
    anim($('.sym', l), [{ transform: 'scale(0) rotate(-40deg)' }, { transform: 'none' }], { d: 640, v: 80, k: 'hupf' });
  },
  async zug(z, gezogen) {
    const r = RAETSEL[this.i], soll = r.loesung[this.schritt];
    const kenn = Schach.feldName(z.von) + Schach.feldName(z.nach);
    const nach = Schach.anwenden(this.pos, z);
    const klang = Schach.imSchach(nach) ? 'schach' : z.schlag ? 'schlagen' : 'zug';
    this.wartet = true;
    if (kenn !== soll) {
      await this.brett.ziehe(z, { klang: 'zug', sofort: gezogen, d: 260 });
      await warte(260);
      Klang.spiele('raetsel-falsch');
      const el = this.brett.figuren.get(z.nach);
      if (el) anim(el.firstChild, [{ transform: 'none' }, { transform: 'translateX(-5%) rotate(-6deg)' }, { transform: 'translateX(5%) rotate(5deg)' }, { transform: 'none' }], { d: 380, k: 'sanft' });
      await warte(380);
      await this.brett.zurueck(z, 320, this.pos);
      this.brett.markiereZug(null);
      this.brett.abzeichen(z.nach, 'nein');   // ruhiges graues Zeichen: hier nicht
      this.meldung('falsch', 'Nicht ganz', 'Das ist noch nicht der Kern. Probier es noch einmal, oder hol dir einen Hinweis.');
      this.wartet = false;
      return;
    }
    await this.brett.ziehe(z, { klang, sofort: gezogen, d: 300 });
    this.pos = nach; this.schritt++;
    this.brett.markiereSchach(Schach.imSchach(nach) ? nach.b.indexOf(nach.dran + 'K') : null);
    if (this.schritt >= r.loesung.length) { this.geloest(z); return; }
    const opfer = this.schritt === 1 && z.fig[1] === 'Q' && r.id === 'tages';
    this.brett.abzeichen(z.nach, opfer ? 'brillant' : 'bester', { gross: opfer });
    Klang.spiele(opfer ? 'brillant' : 'bester');
    if (opfer) this.brett.brillant(z.nach);
    await takt(opfer ? 1200 : 650);
    const a = r.loesung[this.schritt];
    const az = Schach.finde(this.pos, a.slice(0, 2), a.slice(2));
    const an = Schach.anwenden(this.pos, az);
    await this.brett.ziehe(az, { klang: az.schlag ? 'schlagen' : 'zug', d: 320 });
    this.pos = an; this.schritt++;
    this.brett.markiereSchach(Schach.imSchach(an) ? an.b.indexOf(an.dran + 'K') : null);
    this.wartet = false;
    if (this.schritt >= r.loesung.length) this.geloest(az);
  },
  geloest(z) {
    const r = RAETSEL[this.i];
    this.fertig = true; this.wartet = false;
    this.brett.abzeichen(z.nach, 'bester');
    this.brett.ringPing(z.nach, 'var(--k-bester)', { gross: 2.2, d: 900 });
    setTimeout(() => this.brett.ringPing(z.nach, 'var(--k-bester)', { gross: 1.5, d: 700 }), 150 * tempo());
    Klang.spiele('raetsel-richtig');
    this.status('Gelöst', r.erfolg, true);
    this.meldung('richtig', r.lohn[0], r.lohn[1]);
  },
  hilfe() {
    if (this.fertig) return;
    const r = RAETSEL[this.i], soll = r.loesung[this.schritt];
    this.brett.hinweis(Schach.feldIndex(soll.slice(0, 2)), Schach.feldIndex(soll.slice(2)));
    this.meldung('falsch', 'Hinweis', r.hilfe);
    Klang.spiele('klick');
  },
  async zeigen() {
    if (this.fertig || this.wartet) return;
    const r = RAETSEL[this.i]; this.wartet = true;
    while (this.schritt < r.loesung.length) {
      const m = r.loesung[this.schritt];
      const z = Schach.finde(this.pos, m.slice(0, 2), m.slice(2));
      this.brett.pfeil(z.von, z.nach); await takt(500);
      const n = Schach.anwenden(this.pos, z);
      await this.brett.ziehe(z, { klang: Schach.imSchach(n) ? 'schach' : z.schlag ? 'schlagen' : 'zug', d: 340 });
      this.pos = n; this.schritt++;
      await warte(380);
    }
    this.fertig = true; this.wartet = false;
    this.status('So geht es', r.erfolg, false);
    this.meldung('falsch', 'Kein Problem', 'Die Lösung zählt nicht als Fehler. Das Rätsel kommt später noch einmal.');
  },
  weiter() {
    this.i = (this.i + 1) % RAETSEL.length;
    const s = S.raetsel;
    const inhalt = $('.partie-inhalt', s);
    anim(inhalt, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(-30px)' }], { d: 200, k: 'sanft', fill: 'forwards' }).finished.then(() => {
      this.baue(); this.layout();
      anim($('.partie-inhalt', s), [{ opacity: 0, transform: 'translateX(40px)' }, { opacity: 1, transform: 'none' }], { d: 520, k: 'gleiten' });
      this.brett.setze(this.pos, { einblenden: true });
    });
    Klang.spiele('wechsel');
  },
  weg() { S.raetsel.innerHTML = ''; this.brett = null; },
};

      <div class="seiten-kopf"><div class="ueberzeile">${VERLAUF.length} Partien</div><h1 class="disp">Verlauf</h1><p>Jede Partie mit Analyse. Tippe eine an, um sie nachzuspielen.</p></div>
      <div class="verlauf-liste">${VERLAUF.map((v) => {
        const b = BOTS.find((x) => x.id === v.bot);
        const t = { sieg: 'Sieg', niederlage: 'Niederlage', remis: 'Remis' }[v.erg];
        return `<button class="v-zeile dr gross" type="button"><span class="av">${AV.svg(b.id)}</span><span class="txt"><b>${t} gegen ${esc(b.name)}</b><span>${esc(v.zeit)} · ${v.zuege} Züge · ${v.genau} % genau</span></span><span class="v-ergebnis ${v.erg}">${t}</span><span class="v-datum">${esc(v.datum)}</span></button>`;
      }).join('')}</div></div>`;
    s.onclick = (e) => { if (e.target.closest('.v-zeile')) toast('Die Analyse ist in diesem Entwurf nicht nachgebaut.'); };
  },
  eintritt() {
    const s = S.verlauf;
    kopfEintritt(s);
    staffel($$('.seiten-kopf > *', s), { d: 560, v: 60, abstand: 50 });
    staffel($$('.v-zeile', s), { d: 620, v: 160, abstand: 55, von: 'translateY(18px)' });
  },
};

/* ================= Einstellungen ================= */
const ES = [
  { id: 'klang', titel: 'Klang', icon: 'laut', zeilen: [
    { typ: 'pakete' },
    { typ: 'regler', key: 'laut', titel: 'Lautstärke' },
    { typ: 'segment', key: 'stufe', titel: 'Klangstufe', text: '„Nur wichtige“ spielt nur die großen Momente: Start, Brillant, Sterne, Ergebnis und die Zeitwarnung.', opt: [['alle', 'Alle'], ['wichtig', 'Nur wichtige'], ['aus', 'Aus']] },
  ] },
  { id: 'spiel', titel: 'Spiel', icon: 'spiel', zeilen: [
    { typ: 'segment', key: 'zeit', titel: 'Bedenkzeit', text: 'Vorschlag für jede neue Partie.', opt: ZEITEN.map((z) => [z.id, z.name]) },
    { typ: 'schalter', key: 'bestaetigen', titel: 'Zug bestätigen', text: 'Ein zweites Tippen macht den Zug erst fest.' },
    { typ: 'schalter', key: 'autoDame', titel: 'Automatisch Dame', text: 'Bauern werden ohne Rückfrage zur Dame.' },
    { typ: 'segment', key: 'steuerung', titel: 'Figuren bewegen', text: 'Wie du ziehst: mit dem Finger ziehen, antippen oder beides.', opt: [['ziehen', 'Ziehen'], ['tippen', 'Tippen'], ['beides', 'Beides']] },
    { typ: 'schalter', key: 'pfeile', titel: 'Pfeile malen', text: 'Pfeile und Markierungen aufs Brett zeichnen.' },
  ] },
  { id: 'anzeige', titel: 'Anzeige', icon: 'auge', zeilen: [
    { typ: 'segment', key: 'thema', titel: 'Erscheinungsbild', opt: [['hell', 'Hell'], ['dunkel', 'Dunkel'], ['system', 'System']] },
    { typ: 'segment', key: 'tempo', titel: 'Animationstempo', text: 'Gilt für alles, von der Figur bis zur Feier.', opt: [['langsam', 'Langsam'], ['normal', 'Normal'], ['schnell', 'Schnell'], ['aus', 'Aus']], vorschau: 'tempo' },
    { typ: 'schalter', key: 'balken', titel: 'Bewertungsbalken', text: 'Zeigt neben dem Brett, wer besser steht.' },
    { typ: 'schalter', key: 'live', titel: 'Live-Bewertung', text: 'Symbol und Coach nach jedem eigenen Zug.' },
    { typ: 'schalter', key: 'koord', titel: 'Koordinaten', text: 'Buchstaben und Zahlen am Brettrand.' },
    { typ: 'bretter' },
  ] },
  { id: 'coach', titel: 'Coach', icon: 'coach', zeilen: [
    { typ: 'segment', key: 'coach', titel: 'Erklärungen', opt: [['ausfuehrlich', 'Ausführlich'], ['knapp', 'Knapp']], vorschau: 'coach' },
    { typ: 'segment', key: 'sprueche', titel: 'Bot-Sprüche', text: 'Wie gesprächig die Bots während der Partie sind.', opt: [['an', 'An'], ['wenig', 'Wenig'], ['aus', 'Aus']] },
  ] },
];
const Einstellungen = {
  baue() {
    const s = S.einstellungen;
    const zeile = (z) => {
      if (z.typ === 'schalter') return `<div class="es-zeile"><div class="txt"><b id="l-${z.key}">${esc(z.titel)}</b><span>${esc(z.text || '')}</span></div><button class="schalter dr" type="button" role="switch" aria-labelledby="l-${z.key}" aria-checked="${!!E[z.key]}" data-key="${z.key}"><i></i></button></div>`;
      if (z.typ === 'segment') {
        const v = z.vorschau === 'tempo' ? '<div class="tempo-vorschau"><img src="figuren/wN.svg" alt=""></div>'
          : z.vorschau === 'coach' ? `<div class="coach-vorschau">${symbol('bester')}<span class="cv-text"></span></div>` : '';
        return `<div class="es-block"><div class="txt"><b>${esc(z.titel)}</b>${z.text ? `<span>${esc(z.text)}</span>` : ''}</div>${segment('es-' + z.key, z.opt.map(([id, name]) => ({ id, name })), E[z.key])}${v}</div>`;
      }
      if (z.typ === 'regler') return `<div class="es-block"><div class="txt"><b>${esc(z.titel)}</b></div><div class="regler-zeile">${ic('leise')}<div class="regler" role="slider" tabindex="0" aria-label="${esc(z.titel)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(E[z.key] * 100)}" data-key="${z.key}"><div class="bahn"><div class="fuell"></div></div><div class="knauf"></div></div>${ic('laut')}<span class="regler-wert">${Math.round(E[z.key] * 100)} %</span></div></div>`;
      if (z.typ === 'pakete') return `<div class="es-block"><div class="txt"><b>Klangpaket</b><span>Jedes Ereignis klingt anders. Tippe auf „Probe“.</span></div><div class="pakete" role="radiogroup">
        ${[['holz', 'Holz', 'Warme Holzfiguren, Marimba und Glocken.'], ['arcade', 'Arcade', 'Knackig, hell und verspielt.']].map(([id, n, t]) => `<div class="paket dr" role="radio" tabindex="0" aria-checked="${E.paket === id}" data-paket="${id}"><span class="haken">${ic('haken', 'ic-s')}</span><div class="p-kopf"><span class="p-sym">${ic(id)}</span><b>${n}</b></div><span class="t">${t}</span><button class="probe dr" type="button" data-probe="${id}"><span class="wellen"><i></i><i></i><i></i></span>Probe</button></div>`).join('')}</div></div>`;
      if (z.typ === 'bretter') return `<div class="es-block"><div class="txt"><b>Brett und Figuren</b><span>Deine drei Brettfarben, Figuren „Klassisch“.</span></div><div class="bretter" role="radiogroup">
        ${[['nacht', 'Nacht'], ['gruen', 'Grün'], ['holz', 'Holz']].map(([id, n]) => `<button class="brett-opt dr" type="button" role="radio" aria-checked="${E.brett === id}" data-brett="${id}">${miniBrett('r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQ1RK1 w kq - 0 1', { brett: id, zuletzt: [62, 60] })}<span>${n}</span></button>`).join('')}</div></div>`;
      return '';
    };
    s.innerHTML = `<header class="partie-kopf"><button class="knopf-icon dr" type="button" data-akt="pop" aria-label="Zurück">${ic('zurueck')}</button>
      <div class="titel"><b style="font-size:26px">Einstellungen</b><span>Wirkt sofort und bleibt gespeichert</span></div></header>
      <div class="es-layout"><nav class="es-nav" aria-label="Bereiche"><span class="es-nav-pille"></span>${ES.map((g, n) => `<button class="dr" type="button" data-ziel="${g.id}" aria-current="${n === 0}"><span class="ic-box">${ic(g.icon, 'ic-s')}</span>${g.titel}</button>`).join('')}</nav>
      <div class="es-inhalt scroll">${ES.map((g) => `<section class="es-gruppe" id="es-${g.id}"><h2>${g.titel}</h2><div class="es-karte">${g.zeilen.map(zeile).join('')}</div></section>`).join('')}</div></div>`;
    this.binde();
    this.coachVorschau(false);
    requestAnimationFrame(() => $$('.regler', s).forEach((r) => this.reglerSetze(r, E[r.dataset.key], false)));
  },
  eintritt() {
    const s = S.einstellungen;
    staffel($$('.es-nav button', s), { d: 520, v: 200, abstand: 45, von: 'translateX(-12px)' });
    staffel($$('.es-gruppe', s), { d: 640, v: 160, abstand: 70, von: 'translateY(22px)' });
  },
  binde() {
    const s = S.einstellungen;
    s.onclick = (e) => {
      const sw = e.target.closest('.schalter');
      if (sw) { const k = sw.dataset.key; E[k] = !E[k]; sw.setAttribute('aria-checked', String(E[k])); speichere(); wendeAn(k); Klang.spiele('schalter'); return; }
      const pr = e.target.closest('[data-probe]');
      if (pr) { this.probe(pr.dataset.probe, pr); e.stopPropagation(); return; }
      const pk = e.target.closest('[data-paket]');
      if (pk) { E.paket = pk.dataset.paket; speichere(); $$('[data-paket]', s).forEach((p) => p.setAttribute('aria-checked', String(p === pk))); wendeAn('paket'); Klang.spiele('schalter'); return; }
      const bo = e.target.closest('.brett-opt');
      if (bo) { E.brett = bo.dataset.brett; speichere(); $$('.brett-opt', s).forEach((p) => p.setAttribute('aria-checked', String(p === bo))); wendeAn('brett'); Klang.spiele('klick'); return; }
      const nv = e.target.closest('[data-ziel]');
      if (nv) { const ziel = $('#es-' + nv.dataset.ziel, s), box = $('.es-inhalt', s); box.scrollTo({ top: ziel.offsetTop - box.offsetTop - 4, behavior: tempo() ? 'smooth' : 'auto' }); this.nav(nv.dataset.ziel); Klang.spiele('klick'); }
    };
    $('.es-inhalt', s).addEventListener('scroll', () => {
      const box = $('.es-inhalt', s); let akt = ES[0].id;
      for (const g of ES) { const el = $('#es-' + g.id, s); if (el.offsetTop - box.offsetTop - 80 <= box.scrollTop) akt = g.id; }
      if (box.scrollTop + box.clientHeight >= box.scrollHeight - 4) akt = ES[ES.length - 1].id;
      this.nav(akt);
    }, { passive: true });
    for (const g of ES) for (const z of g.zeilen) if (z.typ === 'segment') {
      SEG['es-' + z.key] = (w) => { E[z.key] = w; speichere(); wendeAn(z.key, s.querySelector(`[data-seg="es-${z.key}"] [data-wert="${w}"]`)); };
    }
    $$('.regler', s).forEach((r) => this.regler(r));
    this.nav(ES[0].id);
  },
  nav(id) {
    const s = S.einstellungen; const knoepfe = $$('.es-nav button', s); const k = knoepfe.find((b) => b.dataset.ziel === id);
    if (!k) return;
    knoepfe.forEach((b) => b.setAttribute('aria-current', String(b === k)));
    $('.es-nav-pille', s).style.transform = `translateY(${k.offsetTop - 8}px)`;
  },
  regler(r) {
    let aktiv = false;
    const setze = (x, klang) => {
      const b = $('.bahn', r).getBoundingClientRect();
      const v = Math.max(0, Math.min(1, (x - b.left) / b.width));
      this.reglerSetze(r, Math.round(v * 20) / 20, true);
      if (klang) Klang.spiele('bester', { vol: .8 });
    };
    r.addEventListener('pointerdown', (e) => { aktiv = true; r.classList.add('zieht'); try { r.setPointerCapture(e.pointerId); } catch (f) { /* egal */ } setze(e.clientX); });
    r.addEventListener('pointermove', (e) => { if (aktiv) setze(e.clientX); });
    const los = () => { if (!aktiv) return; aktiv = false; r.classList.remove('zieht'); Klang.spiele('bester', { vol: .9 }); };
    r.addEventListener('pointerup', los); r.addEventListener('pointercancel', los);
    r.addEventListener('keydown', (e) => {
      const d = e.key === 'ArrowRight' || e.key === 'ArrowUp' ? .05 : e.key === 'ArrowLeft' || e.key === 'ArrowDown' ? -.05 : 0;
      if (!d) return; e.preventDefault(); this.reglerSetze(r, Math.max(0, Math.min(1, E[r.dataset.key] + d)), true); Klang.spiele('klick');
    });
  },
  reglerSetze(r, v, speichern) {
    const k = r.dataset.key; E[k] = v;
    const breite = $('.bahn', r).getBoundingClientRect().width || 200;
    r.style.setProperty('--w', v); r.style.setProperty('--px', (v * breite) + 'px');
    r.setAttribute('aria-valuenow', Math.round(v * 100));
    const w = r.parentElement.querySelector('.regler-wert'); if (w) w.textContent = Math.round(v * 100) + ' %';
    if (speichern) { speichere(); wendeAn(k); }
  },
  async probe(paket, knopf) {
    knopf.classList.remove('spielt'); void knopf.offsetWidth; knopf.classList.add('spielt');
    for (const n of ['zug', 'schlagen', 'bester']) { Klang.spiele(n, { paket }); await warte(300, true); }
    setTimeout(() => knopf.classList.remove('spielt'), 600);
  },
  tempoVorschau() {
    const img = $('.tempo-vorschau img', S.einstellungen); if (!img) return;
    const box = img.parentElement.getBoundingClientRect().width;
    anim(img, [{ transform: 'translateX(0)' }, { transform: `translateX(${box - 48}px)` }], { d: 700, k: 'gleiten', fill: 'none' });
    Klang.spiele('zug');
  },
  coachVorschau(animiert) {
    const t = $('.cv-text', S.einstellungen); if (!t) return;
    t.innerHTML = E.coach === 'knapp' ? '<b>Bester Zug</b> Dd5+' : '<b>Bester Zug</b> Dd5+<br>Schach, und der König muss in die Ecke. Danach jagt der Springer ihn zurück.';
    if (animiert) anim(t, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { d: 420, k: 'weich' });
  },
};

/* ---------- Einstellung anwenden ---------- */
function wendeAn(k, quelle) {
  if (k === 'thema') setzeModus(quelle || $('.knopf-thema'));
  if (k === 'tempo') { setzeTempo(); Einstellungen.tempoVorschau(); }
  if (k === 'paket') Klang.vorladen();
  if (k === 'laut') Klang.setzeLaut();
  if (k === 'brett') {
    if (Partie.brett) Partie.brett.farbe(E.brett);
    if (Raetsel.brett) Raetsel.brett.farbe(E.brett);
    $$('.brettwahl button').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.brett === E.brett)));
    $$('.mini').forEach((m) => { const f = { nacht: ['#e4e8f6', '#7c87b6'], gruen: ['#eeeed2', '#769656'], holz: ['#f0d9b5', '#b58863'] }[E.brett]; if (!m.closest('.brett-opt')) { m.style.setProperty('--fh', f[0]); m.style.setProperty('--fd', f[1]); } });
  }
  if (k === 'koord') ROOT.classList.toggle('ohne-koord', !E.koord);
  if (k === 'balken') ROOT.classList.toggle('aus-balken', !E.balken);
  if (k === 'coach') Einstellungen.coachVorschau(true);
  if (k === 'zeit') App.zeit = E.zeit;
}

/* ================= Globale Aktionen ================= */
const SEITE = { arena: Arena, training: Training, verlauf: Verlauf };
document.addEventListener('click', (e) => {
  const t = e.target.closest('.tab');
  if (t) { zeigeTab(t.dataset.tab); return; }
  const a = e.target.closest('[data-akt]'); if (!a || a.disabled) return;
  switch (a.dataset.akt) {
    case 'thema': E.thema = ROOT.dataset.modus === 'dunkel' ? 'hell' : 'dunkel'; speichere(); setzeModus(a); Klang.spiele('schalter'); break;
    case 'klang': {
      E.stumm = !E.stumm; speichere(); Klang.setzeLaut();
      $$('.knopf-klang').forEach((k) => k.setAttribute('aria-pressed', String(!E.stumm)));
      anim($('svg', a), [{ transform: 'scale(.7)' }, { transform: 'none' }], { d: 520, k: 'hupf' });
      if (!E.stumm) Klang.spiele('schalter');
      toast(E.stumm ? 'Klang aus' : 'Klang an');
      break;
    }
    case 'einstellungen': Einstellungen.baue(); push('einstellungen'); Einstellungen.eintritt(); break;
    case 'pop': pop(); break;
    case 'spielen': Duell.start(); break;
    case 'partie-zurueck': zurArena(); Klang.spiele('zurueck'); break;
    case 'demo': Partie.demo(); break;
    case 'hinweis': Partie.hinweis(); break;
    case 'undo': Partie.undo(); break;
    case 'drehen': Partie.drehen(); break;
    case 'aufgeben': Partie.aufgeben(); break;
    case 'analyse': toast('Die Analyse ist in diesem Entwurf nicht nachgebaut.'); break;
    case 'naechster': {
      const P = Partie.P, b = P.bot, i = b.stufe - 1;
      const vorher = sterneGesamt();
      const neu = STAND.hilfe ? 2 : 3;
      STAND.sterne[b.id] = Math.max(STAND.sterne[b.id] || 0, neu);
      let frei = null;
      if (i === STAND.naechster && STAND.naechster < 9) { STAND.naechster++; frei = STAND.naechster; }
      App.bot = STAND.naechster;
      Ergebnis.schliesse(() => zurArena({ freischalten: frei, sterneVorher: vorher }));
      Klang.spiele('wechsel');
      break;
    }
    case 'arena': Ergebnis.schliesse(() => zurArena()); Klang.spiele('zurueck'); break;
    case 'revanche': Ergebnis.schliesse(() => { const P = Partie.P; Partie.neu(P.bot, P.farbe, ZEITEN.find((z) => z.id === App.zeit) || ZEITEN[0]); Partie.einblenden(); Partie.start(); }); break;
  }
});
window.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('#ergebnis').hidden) return;
  if (!$('#sheet').hidden) { $('#sheet .decke-grund').click(); return; }
  if (App.stapel.length) pop();
});

/* ================= Start ================= */
let groesseT = 0;
window.addEventListener('resize', () => {
  clearTimeout(groesseT);
  groesseT = setTimeout(() => {
    if (Partie.brett) { Partie.layout(); }
    if (Raetsel.brett) Raetsel.layout();
    tabsSetze(App.tab);
    if (Arena.t && !S.arena.hidden) { Arena.mass(); Arena.zentriere(App.bot, false); }
    $$('.regler', S.einstellungen).forEach((r) => Einstellungen.reglerSetze(r, E[r.dataset.key], false));
  }, 80);
});
document.addEventListener('visibilitychange', () => { /* Uhren pausieren automatisch (siehe uhrStart) */ });
reduziert.addEventListener && reduziert.addEventListener('change', setzeTempo);
(function start() {
  ROOT.dataset.modus = modusAus();
  setzeTempo();
  ROOT.classList.toggle('ohne-koord', !E.koord);
  ROOT.classList.toggle('aus-balken', !E.balken);
  Klang.vorladen();
  $$('.tab').forEach((t) => t.insertAdjacentHTML('afterbegin', ic(t.dataset.tab, 'ic-s')));
  Arena.baue();
  tabsSetze('arena');
  Arena.eintritt();
})();

</script>
